name: Build and Release Docker Images

on:
  push:
    branches:
      - master
      - dev
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        php_version: ['8.5']
        variant:
          - name: "cli"
            dockerfile: "ncc.dockerfile"
            tag: "latest"
          - name: "fpm"
            dockerfile: "ncc-fpm.dockerfile"
            tag: "fpm"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,enable=false
            type=raw,value={{branch}}-${{ matrix.variant.tag }},enable=${{ github.ref_type == 'branch' && matrix.variant.tag != 'latest' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant.tag }},enable=${{ github.ref_type == 'tag' && matrix.variant.tag != 'latest' }}
            type=raw,value=${{ matrix.variant.tag }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.tag != 'latest' }}
            type=raw,value={{branch}},enable=${{ github.ref_type == 'branch' && matrix.variant.tag == 'latest' }}
            type=semver,pattern={{version}},enable=${{ matrix.variant.tag == 'latest' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.tag == 'latest' }}
          labels: |
            org.opencontainers.image.title=ncc
            org.opencontainers.image.description=ncc's official Docker ${{ matrix.variant.name }} image
            org.opencontainers.image.vendor=Nosial

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

