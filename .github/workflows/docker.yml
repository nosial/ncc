name: Build and Release Docker Images

on:
  push:
    branches:
      - master
      - dev
      - 'release/**'
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        php_version: ['8.5']
        variant:
          - name: "cli"
            dockerfile: "ncc.dockerfile"
            tag: "latest"
            target: "production"
          - name: "fpm"
            dockerfile: "ncc-fpm.dockerfile"
            tag: "fpm"
            target: "production"
          - name: "runtime-cli"
            dockerfile: "ncc.dockerfile"
            tag: "runtime-cli"
            target: "runtime"
          - name: "runtime-fpm"
            dockerfile: "ncc-fpm.dockerfile"
            tag: "runtime-fpm"
            target: "runtime"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,enable=false
            type=raw,value=builder,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.name == 'cli' }}
            type=raw,value={{branch}}-builder,enable=${{ github.ref_type == 'branch' && matrix.variant.name == 'cli' }}
            type=semver,pattern={{version}},suffix=-builder,enable=${{ github.ref_type == 'tag' && matrix.variant.name == 'cli' }}
            type=raw,value={{branch}}-${{ matrix.variant.tag }},enable=${{ github.ref_type == 'branch' && matrix.variant.tag != 'latest' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.variant.tag }},enable=${{ github.ref_type == 'tag' && matrix.variant.tag != 'latest' }}
            type=raw,value=${{ matrix.variant.tag }},enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.tag != 'latest' }}
            type=raw,value={{branch}},enable=${{ github.ref_type == 'branch' && matrix.variant.tag == 'latest' }}
            type=semver,pattern={{version}},enable=${{ matrix.variant.tag == 'latest' }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.variant.tag == 'latest' }}
          labels: |
            org.opencontainers.image.title=ncc
            org.opencontainers.image.description=ncc's official Docker ${{ matrix.variant.name }} image
            org.opencontainers.image.vendor=Nosial

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          target: ${{ matrix.variant.target }}
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ncc-${{ matrix.php_version }}-${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=ncc-${{ matrix.php_version }}-${{ matrix.variant.name }}
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            NCC_BUILD=${{ github.sha }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

